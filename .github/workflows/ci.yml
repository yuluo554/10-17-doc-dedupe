name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. It never writes to the
# repo, never publishes, and never touches a Release.
permissions:
  contents: read

# One run per ref. `cancel-in-progress` stays false on purpose: the release gate
# treats a cancelled run on the tag target commit as "not verified", so letting a
# queued run finish is worth more here than saving a runner minute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]

    env:
      # Keep stdout/stderr UTF-8 in every step; the code has an entry-point guard
      # as well, but subprocess output and pytest's own prints are not covered by it.
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history on purpose: tests/test_repo_invariants.py walks every
          # blob reachable from every ref, and the desensitization promise is
          # about the published *history*, not just the tip. With the default
          # shallow checkout that gate would silently degrade to one commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with the optional extras the suite exercises)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,extract,web]"

      - name: Smoke test the installed console script
        run: |
          python -m docdedupe --version
          doc-dedupe --version

      - name: Verify the synthetic corpus is frozen
        run: python tools/gen_samples.py --check

      - name: Run the test suite
        run: python -m pytest -q

      - name: Selftest
        run: doc-dedupe selftest
